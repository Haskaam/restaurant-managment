services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: restaurant_app

    ports:
      - "8000:8000"

    volumes:
      - .:/var/www

    depends_on:
      - db

    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: restaurant_management
      DB_USERNAME: restaurant
      DB_PASSWORD: restaurant_password


  db:
    image: mysql:8.0

    container_name: restaurant_db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: restaurant_management
      MYSQL_USER: restaurant
      MYSQL_PASSWORD: restaurant_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3308:3306"

    volumes:
      - restaurant_db_data:/var/lib/mysql


volumes:
  restaurant_db_data:
